<script>/* Tylos Labour engine — zip/xlsx patching + payroll rules. No dependencies. */
(function (G) {
  'use strict';
  const TL = {};

  /* ---------------- CRC32 ---------------- */
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  async function streamBytes(bytes, stream) {
    const s = new Blob([bytes]).stream().pipeThrough(stream);
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  const inflateRaw = (b) => streamBytes(b, new DecompressionStream('deflate-raw'));
  const deflateRaw = (b) => streamBytes(b, new CompressionStream('deflate-raw'));
  const enc = new TextEncoder(), dec = new TextDecoder('utf-8');

  /* ---------------- ZIP ---------------- */
  class Zip {
    constructor() { this.entries = new Map(); this.order = []; }
    static async read(buf) {
      const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      let eocd = -1;
      for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      if (eocd < 0) throw new Error('Not a valid .xlsx file (zip directory not found).');
      const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
      const z = new Zip();
      for (let i = 0; i < count; i++) {
        if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Corrupt zip directory.');
        const method = dv.getUint16(p + 10, true), time = dv.getUint16(p + 12, true), date = dv.getUint16(p + 14, true);
        const crc = dv.getUint32(p + 16, true), csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true);
        const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
        const off = dv.getUint32(p + 42, true);
        const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
        const lnl = dv.getUint16(off + 26, true), lxl = dv.getUint16(off + 28, true);
        const ds = off + 30 + lnl + lxl;
        z.entries.set(name, { name, method, time, date, crc, csize, usize, raw: u8.subarray(ds, ds + csize), data: null, dirty: false });
        z.order.push(name);
        p += 46 + nlen + xlen + clen;
      }
      return z;
    }
    has(n) { return this.entries.has(n); }
    async bytes(n) {
      const e = this.entries.get(n); if (!e) return null;
      if (!e.data) e.data = e.method === 0 ? e.raw : await inflateRaw(e.raw);
      return e.data;
    }
    async text(n) { const b = await this.bytes(n); return b ? dec.decode(b) : null; }
    setText(n, s) { this.setBytes(n, enc.encode(s)); }
    setBytes(n, b) {
      let e = this.entries.get(n);
      if (!e) { e = { name: n, method: 8, time: 0, date: 0x5821 }; this.entries.set(n, e); this.order.push(n); }
      e.data = b; e.dirty = true;
    }
    remove(n) { this.entries.delete(n); this.order = this.order.filter(x => x !== n); }
    async write() {
      const parts = [], central = []; let offset = 0;
      for (const n of this.order) {
        const e = this.entries.get(n);
        let raw, crc, csize, usize, method;
        if (e.dirty) { usize = e.data.length; crc = crc32(e.data); raw = await deflateRaw(e.data); method = 8; csize = raw.length; }
        else { raw = e.raw; crc = e.crc; csize = e.csize; usize = e.usize; method = e.method; }
        const nb = enc.encode(n);
        const lh = new Uint8Array(30 + nb.length); const lv = new DataView(lh.buffer);
        lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true); lv.setUint16(8, method, true);
        lv.setUint16(10, e.time || 0, true); lv.setUint16(12, e.date || 0x5821, true); lv.setUint32(14, crc, true);
        lv.setUint32(18, csize, true); lv.setUint32(22, usize, true); lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
        lh.set(nb, 30);
        const ch = new Uint8Array(46 + nb.length); const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, method, true);
        cv.setUint16(12, e.time || 0, true); cv.setUint16(14, e.date || 0x5821, true); cv.setUint32(16, crc, true); cv.setUint32(20, csize, true); cv.setUint32(24, usize, true);
        cv.setUint16(28, nb.length, true); cv.setUint32(42, offset, true); ch.set(nb, 46);
        parts.push(lh, raw); central.push(ch); offset += lh.length + raw.length;
      }
      let csz = 0; for (const c of central) csz += c.length;
      const end = new Uint8Array(22); const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, central.length, true); ev.setUint16(10, central.length, true);
      ev.setUint32(12, csz, true); ev.setUint32(16, offset, true);
      const out = new Uint8Array(offset + csz + 22); let p = 0;
      for (const a of parts) { out.set(a, p); p += a.length; } for (const a of central) { out.set(a, p); p += a.length; } out.set(end, p);
      return out;
    }
  }
  TL.Zip = Zip;

  /* ---------------- XML helpers ---------------- */
  const escXml = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function rosterFind(l) { return S.roster.find(p => TL.personKey(p.name, p.cat) === l.key); }
  function rowHtml(l, i) {

      <td class="paid">${leave ? esc(TL.STATUS[l.status]) : r.paidIn != null ? TL.toHM(r.paidIn) + '–' + TL.toHM(r.paidOut) : '<span class="muted">–</span>'}</td>

  function bindRow(tr) {

      else if (k === 'group') { l.group = el.value; if (l.isNew) l.profile = TL.defaultProfileFor(S, l.group); l.role = KIND(l.group) === 'agency' ? TL.groupCode(S, l.group) : ''; l.include = KIND(l.group) !== 'ignore'; if (l.isNew) { l.flags = l.flags.filter(f => f.code !== 'new'); } }

  function useWb(l) {

  function addNewPerson() {

  async function currentWorkbookBytes() { if (st.wb) return st.wb; if (st.wbSaved) return st.wbSaved.bytes; return null; }
  async function generateWorkbook(probs) {
    if (probs.length && !confirm(`${probs.length} item(s) still need checking:\n\n• ${probs.slice(0, 10).join('\n• ')}\n\nRows with missing times are written with a "TIME MISSING" remark and no hours. Continue?`)) return;
    const btn = $('#genWb'); btn.disabled = true; btn.innerHTML = 'Working…';
    try {
      if (cloud.on) await ensureLatestWorkbook(true);
      let out, res, meta = null, base = st.wb ? { bytes: st.wb, name: st.wbName, version: 'force' } : st.wbSaved;
      for (let attempt = 0; attempt < 3; attempt++) {
        const wb = await TL.Workbook.open(base.bytes);
        res = await TL.applyDay(wb, S, st.date, st.lines);
        out = await wb.save();
        if (!cloud.on) break;
        const r = await cloud.req('/workbook', { method: 'PUT', body: out, headers: { 'X-Base-Version': String(base.version ?? 'force'), 'X-Name': encodeURIComponent(base.name || 'Labour time sheet and task record.xlsx'), 'X-Last-Date': st.date } });
        if (r.status === 409) { toast('Someone else saved the workbook a moment ago — adding your day to their newer copy…', 'warn'); await ensureLatestWorkbook(true); base = st.wbSaved; continue; }
        if (!r.ok) throw new Error('the shared copy could not be saved (HTTP ' + r.status + '). Nothing was shared; try again.');
        meta = await r.json(); break;
      }
      if (cloud.on && !meta) throw new Error('the workbook kept changing while saving. Please try again.');
      let added = 0;
      for (const l of st.lines) {
        if (!l.isNew || l.group === 'New') continue;
        if (!S.roster.some(p => TL.personKey(p.name, p.cat) === l.key)) { S.roster.push({ name: l.name, cat: l.cat, display: l.display, group: l.group, profile: l.profile, start: TL.toHM(l.start), end: TL.toHM(l.end), source: l.source, role: l.role, agencyRole: l.agencyRole, slot: l.slot, active: true }); added++; }
      }
      if (added) ensureIds(S);
      logEvent('Daily output', `Workbook updated for ${TL.fmtDMY(st.date)}: ${st.lines.filter(l => l.include && TL.isDaily(S, l.group)).length} in Daily Record${added ? `, ${added} new person(s) added to Staff` : ''}`);
      const name = (base.name || 'Labour time sheet and task record.xlsx').replace(/\.xlsx$/i, '') + '.xlsx';
      await idb.set('latestWorkbook', { name, savedAt: Date.now(), bytes: out, lastDate: st.date, version: meta ? meta.version : null, by: cloud.who });
      st.wbSaved = await idb.get('latestWorkbook'); st.wb = null; st.wbName = ''; wbCache = { bytes: null, wb: null };
      if (cloud.on) await fetchState().catch(() => { });
      await commitSettings('Daily output', true);
      download(out, name);
      st.log.unshift({ at: new Date(), date: st.date, lines: res.log, warnings: res.warnings, added });
      toast(`${ICON.check} Workbook updated for ${TL.fmtDMY(st.date)}${cloud.on ? ' and shared with everyone' : ' and saved as the latest copy'}.`);
      renderOutput($('#main')); await rebuildLines();
    } catch (e) { console.error(e); toast('Could not update: ' + esc(e.message), 'err', 9000); btn.disabled = false; btn.innerHTML = 'Update Labour time sheet & task record'; }
  }

  function setupPlan(p) {
    if (!S.startPlan) S.startPlan = {};
    const today = new Date(); const iso0 = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    if (!st.planDate) st.planDate = TL.addDays(iso0, 1);
    // tidy: drop plans older than 60 days
    for (const d of Object.keys(S.startPlan)) if (d < TL.addDays(iso0, -60)) delete S.startPlan[d];
    const day = S.startPlan[st.planDate] || { groups: {}, people: {} };
    const groups = GROUPS_ALL().filter(g => g.kind !== 'ignore');
    const people = S.roster.filter(r => r.active && KIND(r.group) !== 'ignore').sort((a, b) => TL.groupRank(S, a.group) - TL.groupRank(S, b.group) || a.display.localeCompare(b.display));
    const upcoming = Object.keys(S.startPlan).filter(d => d >= iso0).sort();
    const nice = d => new Date(d + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    p.innerHTML = `<div class="card"><div class="card-h"><div><h2>Start-time plan</h2><p class="muted small">Tell the site in advance when start times change, e.g. "Air agency starts 06:00 tomorrow". On that date the confirm step uses these times automatically (you can still change them there). Leave a box empty to use the person's normal start.</p></div></div>
      <div class="row gap"><label class="fld"><span>Date</span><input type="date" id="plD" value="${st.planDate}"></label>
        <div class="quick">${[0, 1, 2].map(n => { const d = TL.addDays(iso0, n); return `<button class="chip ${d === st.planDate ? 'on' : ''}" data-pd="${d}">${n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : nice(d)}</button>`; }).join('')}</div>
        ${upcoming.length ? `<span class="small muted">Planned: ${upcoming.map(d => `<a href="#" data-pd="${d}">${nice(d)}</a>`).join(' · ')}</span>` : ''}</div>
      <h3 style="margin:14px 0 6px">Whole group</h3>
      <div class="plan-groups">${groups.map(g => `<label class="plan-g"><b class="dot" style="border-left-color:${gColor(g.id)}"></b>${esc(g.label)}<input type="time" data-pg="${esc(g.id)}" value="${esc((day.groups || {})[g.id] || '')}" list="startTimes"></label>`).join('')}</div>
      <h3 style="margin:16px 0 6px">Individual people <span class="muted small">(overrides the group time)</span></h3>
      <input class="search" id="plQ" placeholder="Search name…" value="${esc(st.planQ || '')}">
      <div class="tbl-wrap" style="max-height:46vh;margin-top:8px"><table class="grid edit"><thead><tr><th>Name</th><th>Group</th><th>Normal start</th><th>Start on ${esc(nice(st.planDate))}</th></tr></thead><tbody>
      ${people.filter(r => !st.planQ || TL.normName(r.display + ' ' + r.name).includes(TL.normName(st.planQ))).map(r => `<tr><td>${esc(r.display)}</td><td><span class="dot" style="border-left-color:${gColor(r.group)}"></span>${esc(GL(r.group))}</td><td>${esc(r.start || S.defaultStart)}</td><td><input type="time" data-pp="${esc(r.id)}" value="${esc((day.people || {})[r.id] || '')}" list="startTimes"></td></tr>`).join('')}</tbody></table></div>
      <div class="row gap" style="margin-top:10px"><button class="btn sm ghost" id="plClear">Clear this date</button></div>
      <datalist id="startTimes"><option value="05:00"><option value="06:00"><option value="07:00"><option value="07:30"><option value="08:00"><option value="09:00"><option value="12:00"></datalist></div>`;
    const setDay = () => { const d = S.startPlan[st.planDate] || (S.startPlan[st.planDate] = { groups: {}, people: {} }); d.groups = d.groups || {}; d.people = d.people || {}; return d; };
    const tidy = () => { const d = S.startPlan[st.planDate]; if (d && !Object.keys(d.groups || {}).length && !Object.keys(d.people || {}).length) delete S.startPlan[st.planDate]; };
    $('#plD').onchange = e => { if (e.target.value) { st.planDate = e.target.value; setupPlan(p); } };
    $$('[data-pd]', p).forEach(b => b.onclick = e => { e.preventDefault(); st.planDate = b.dataset.pd; setupPlan(p); });
    $$('[data-pg]', p).forEach(el => el.onchange = () => { const d = setDay(); if (el.value) d.groups[el.dataset.pg] = el.value; else delete d.groups[el.dataset.pg]; tidy(); markDirty(); });
    $$('[data-pp]', p).forEach(el => el.onchange = () => { const d = setDay(); if (el.value) d.people[el.dataset.pp] = el.value; else delete d.people[el.dataset.pp]; tidy(); markDirty(); });
    $('#plQ').oninput = e => { st.planQ = e.target.value; const pos = e.target.selectionStart; setupPlan(p); const i = $('#plQ'); i.focus(); i.setSelectionRange(pos, pos); };
    $('#plClear').onclick = () => { if (!S.startPlan[st.planDate]) return; if (!confirm('Remove all planned start times for this date?')) return; delete S.startPlan[st.planDate]; markDirty(); setupPlan(p); };
  }

  /* ---------- Change log ---------- */
  function setupLog(p) {
    const all = (S.changeLog || []).slice().sort((a, b) => b.at - a.at);
    const q = TL.normName(st.logQ || '');
    const list = all.filter(e => !q || TL.normName(`${e.by} ${e.area} ${e.text}`).includes(q));
    const fmt = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
    p.innerHTML = `<div class="card"><div class="card-h"><div><h2>Change log</h2><p class="muted small">Every saved change to Setup, every workbook update and every agency timesheet download — who, when, what. Shared with everyone. Keeps the latest 2,000 entries.</p></div>
      <button class="btn sm ghost" id="logCsv">${ICON.down} Download CSV</button></div>
      <input class="search" id="logQ" placeholder="Search (name, person, date…)" value="${esc(st.logQ || '')}">
      <div class="tbl-wrap" style="margin-top:8px"><table class="grid"><thead><tr><th>When</th><th>Who</th><th>Area</th><th>What changed</th></tr></thead><tbody>
      ${list.slice(0, 500).map(e => `<tr><td style="white-space:nowrap">${fmt(e.at)}</td><td>${esc(e.by || '—')}</td><td>${esc(e.area)}</td><td>${esc(e.text)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted c">Nothing logged yet.</td></tr>'}</tbody></table></div>
      ${list.length > 500 ? `<p class="small muted">Showing the latest 500 of ${list.length}. Download the CSV for all.</p>` : ''}</div>`;
    $('#logQ').oninput = e => { st.logQ = e.target.value; const pos = e.target.selectionStart; setupLog(p); const i = $('#logQ'); i.focus(); i.setSelectionRange(pos, pos); };
    $('#logCsv').onclick = () => { const rows = [['When', 'Who', 'Area', 'What changed'], ...list.map(e => [fmt(e.at), e.by || '', e.area, e.text])]; download(new TextEncoder().encode('﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n')), `Tylos labour change log ${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv'); };
  }

  function setupSecurity(p) {
    p.innerHTML = `<div class="card"><h2>Backup</h2>
      <fieldset class="box"><legend>Password</legend><p class="small">One shared password for everyone. <b>Changing the password is switched off</b> for now — ask the administrator if it needs to change.</p></fieldset>
      <fieldset class="box"><legend>Settings backup / share</legend><p class="small muted">Export staff list, rules, rates and options to a file — import it on a colleague's computer so everyone works the same way.</p>
        <button class="btn sm ghost" id="exS">${ICON.down} Export settings</button> <label class="btn sm ghost">${ICON.up} Import settings<input type="file" id="imS" accept=".json" hidden></label>
        <button class="btn sm ghost danger" id="rsS">Reset everything to defaults</button></fieldset></div>`;
    $('#exS').onclick = async () => { const c = JSON.parse(JSON.stringify(S)); c.agencyTemplates = {}; for (const g of AGS()) { const t = await getTemplate(g); if (t) c.agencyTemplates[g] = { name: t.name, b64: bytesToB64(t.bytes) }; } download(new TextEncoder().encode(JSON.stringify(c, null, 1)), `tylos-labour-settings-${new Date().toISOString().slice(0, 10)}.json`, 'application/json'); };
    $('#imS').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await readText(f)); if (!j.roster || !j.profiles) throw new Error('Not a Tylos settings file.'); if (!confirm('Replace this browser’s staff list, rules, rates and options with the file?' + (j.pwHash ? '\n(The password from the file will also be used.)' : ''))) return; await applySettingsFile(j); sessionStorage.setItem('tylosLabour.unlocked', S.pwHash); toast('Settings imported.'); render(); } catch (err) { toast(esc(err.message), 'err'); } };
    $('#rsS').onclick = async () => { if (!confirm('Reset staff, rules, rates and options to the original defaults — FOR EVERYONE?')) return; const ph = S.pwHash; const keepLog = S.changeLog; S = loadSettings(); S.pwHash = ph; fillDefaults(S); ensureIds(S); S.changeLog = keepLog; logEvent('Backup', 'Reset all settings to defaults'); await commitSettings('Backup', true); toast('Reset done.'); render(); };
  }

  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
